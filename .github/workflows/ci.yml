name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Static checks
        run: |
          npm run typecheck
          npm run lint

      - name: Unit tests
        run: npm run test:unit

      # Only the services the app uses: Postgres, Auth, REST and the gateway.
      - name: Start Supabase
        run: npx supabase start -x studio,imgproxy,inbucket,realtime,storage-api,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Write .env.local from the local stack
        run: npm run env:local

      - name: Build and start the app
        run: |
          npm run build
          npm run start > app.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http://localhost:3000/login

      - name: API tests
        run: npm run test:api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            app.log
          retention-days: 7
